name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      # go.mod only states the minimum Go version; build with the latest patch of that minor so the
      # binaries pick up stdlib security fixes.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Set up Snyk CLI
        uses: steadybit/extension-kit/.github/actions/setup-snyk@main # NOSONAR githubactions:S7637 - our own action

      - name: Snyk monitor
        # The snyk CLI on the runner reads the stdlib version from the Go toolchain set up above; the
        # snyk/actions/golang Docker action uses its own Go and reports a stdlib the binaries don't contain.
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor